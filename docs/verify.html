<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify a Tok DOI record</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/javascript-opentimestamps@latest/opentimestamps.min.js" defer></script>
</head><body>
<div class="wrap">
  <header><h1>Verify a Tok DOI record</h1><div class="tag">any registry</div></header>
  <p>Paste a record (one JSON object). This decodes the AyeSHA proof, checks the
     OpenTimestamps attestation, and — where applicable — recomputes the subject hash.</p>
  <div class="card">
    <textarea id="rec" rows="10" placeholder='{"tok":"tok:general:0001", ...}'></textarea>
    <button id="go">Verify</button><div id="out" class="status"></div>
  </div>
  <footer>project-ilm/tok-doi · © 1993–2026 Abhishek Choudhary · model: Claude Opus 4.8</footer>
</div>
<script type="module">
import { sha256Hex, otsVerifyHash } from './tok.js';
import { Ayesha } from './ayesha.js';
const $=id=>document.getElementById(id);
$('go').onclick=async()=>{
  const out=$('out'); out.className='status'; out.textContent='Verifying…';
  let r; try{ r=JSON.parse($('rec').value); }catch{ out.className='status warn'; out.textContent='Not valid JSON.'; return; }
  const L=[];
  try{
    // subject digest: general records use subject.sha256; endorsement records use statement_sha256
    let digest = r.subject?.sha256 || r.statement_sha256;
    if(r.statement && r.statement_sha256){
      const re=await sha256Hex(r.statement);
      L.push((re===r.statement_sha256?'✓':'✗')+' statement hash matches record');
      digest=r.statement_sha256;
    } else if(r.subject?.sha256){
      L.push('◐ subject digest '+r.subject.sha256.slice(0,16)+'… (supply the artifact to re-hash offline)');
    }
    const otsBytes=await Ayesha.decode(r.ots_ayesha);
    L.push('✓ AyeSHA decoded ('+otsBytes.length+' bytes of OTS proof)');
    if(window.OpenTimestamps && digest){
      const res=await otsVerifyHash(digest, otsBytes);
      if(res && Object.keys(res).length){ const k=Object.keys(res)[0];
        L.push('✓ OpenTimestamps attested on '+k+' — '+new Date((res[k].timestamp||0)*1000).toISOString()); }
      else L.push('◐ OTS proof present, attestation pending (upgrade later)');
    } else L.push('◐ OTS library not loaded — hash & AyeSHA checks only');
    out.className='status ok'; out.innerHTML=L.join('<br>');
  }catch(e){ out.className='status warn'; out.innerHTML=L.concat('✗ '+e.message).join('<br>'); }
};
</script>
</body></html>
